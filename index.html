<script>
const services=[{id:'shape',name:'Архитектура бровей',duration:45,price:1800,desc:'Форма и аккуратная коррекция. Естественный акцент на вашем взгляде.'},{id:'color',name:'Форма + окрашивание',duration:60,price:2500,desc:'Форма и оттенок в одном визите. Обсудите желаемую насыщенность с мастером.'},{id:'lam',name:'Ламинирование + форма',duration:90,price:3500,desc:'Укладка и оформление. Подходит ли процедура именно вам, уточнит мастер.'}];
const masters=[{id:'anna',name:'Анна',tag:'Спокойный подход, внимание к деталям'},{id:'lena',name:'Елена',tag:'Естественная форма, мягкий акцент'}];const KEY='tiho-demo-v1';let route='home',step=1,draft={},lastId=null;const app=document.querySelector('#app'),modal=document.querySelector('#modal');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function datePlus(n){let d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const fmt=d=>new Date(d+'T12:00').toLocaleDateString('ru',{day:'numeric',month:'long'});const money=n=>n.toLocaleString('ru')+' ₽';const srv=id=>services.find(x=>x.id===id);const mst=id=>masters.find(x=>x.id===id);const time=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');const mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3));

function seed(){if(localStorage.getItem(KEY))return;let db={appointments:[{id:'DEMO-101',service:'color',master:'anna',date:datePlus(1),time:'11:00',name:'Клиент А (тест)',contact:'demo@example.test',status:'confirmed'},{id:'DEMO-102',service:'shape',master:'lena',date:datePlus(1),time:'14:00',name:'Клиент Б (тест)',contact:'demo@example.test',status:'pending'}],log:[]};log(db,'Созданы две демонстрационные записи');write(db)}seed();
function fits(d,ignore){let s=srv(d.service),start=mins(d.time);if(!s||!mst(d.master)||!d.date||!d.time||d.date<datePlus(0)||d.date>datePlus(30)||start<600||start+s.duration>1140||start%30!==0)return false;if(d.date===datePlus(0)&&start<=new Date().getHours()*60+new Date().getMinutes())return false;return !read().appointments.some(a=>a.id!==ignore&&a.status!=='cancelled'&&a.master===d.master&&a.date===d.date&&start<mins(a.time)+srv(a.service).duration&&start+s.duration>mins(a.time))}

l for="name">Имя</label><input id="name" name="name" required minlength="2" maxlength="60" autocomplete="off" value="${esc(draft.name)}" placeholder="Например, Тест Анна"><label for="contact">Телефон или e-mail</label><input id="contact" name="contact" required maxlength="100" autocomplete="off" value="${esc(draft.contact)}" placeholder="demo@example.test"><div class="checks" style="margin-top:20px"><input id="demo-consent" type="checkbox" required><label for="demo-consent">Понимаю, что это тестовая запись. Использую вымышленные данные; они сохранятся только в этом браузере.</label></div><p class="error" id="error" role="alert"></p><div class="actions"><button type="button" data-next="2">← Время</button><button class="primary">Создать тестовую запись ↗</button></div></form>`}</section>${summary()}</div>${srv(draft.service)?`<div class="mobile-bookbar"><div><strong>${money(srv(draft.service).price)}</strong><small>${srv(draft.service).duration} минут · цена в демо</small></div>${step===3?'<button class="primary" type="submit" form="booking-form">Записаться на это время</button>':`<button class="primary" data-next="${step+1}" ${step===2&&(!draft.time||!fits(draft))?'disabled':''}>${step===1?'Далее: время':'Далее: контакты'} →</button>`}</div>`:''}` }
function card(a){let s=srv(a.service);return `<article class="box" style="margin-bottom:16px"><span class="status ${a.status==='cancelled'?'cancelled':''}">${{pending:'Ожидает подтверждения',confirmed:'Подтверждена',cancelled:'Отменена'}[a.status]}</span><h3 style="margin:15px 0 5px">${s.name}</h3><p>${fmt(a.date)} · ${a.time}–${time(mins(a.time)+s.duration)} · ${mst(a.master).name}</p><p class="muted">${esc(a.name)} · ${money(s.price)} · № ${a.id}</p>${a.status!=='cancelled'?`<div class="actions">${a.status==='pending'?`<button data-confirm="${a.id}">Подтвердить визит</button>`:''}<button data-move="${a.id}">Перенести</button><button data-cancel="${a.id}">Отменить запись</button><button data-remind="${a.id}">Предпросмотр напоминания</button></div>`:''}</article>`}
function mine(){let all=read().appointments.filter(a=>!a.id.startsWith('DEMO'));return `<div class="eyebrow">Мои записи / демонстрация</div><h2>Все планы<br><i>в одном месте.</i></h2><p class="muted">Здесь видны тестовые записи, созданные в этом браузере. В реальном сервисе нужен защищённый вход клиента.</p>${all.length?all.map(card).join(''):`<div class="box"><h3>Пока нет записей</h3><p>Выберите услугу и время — ваш визит появится здесь и в кабинете студии.</p><button class="primary" data-nav="book">Записаться ↗</button></div>`}`}
let adminDate=datePlus(1),adminStatus='all',adminSearch='',adminMode='schedule';function admin(){let db=read(),all=db.appointments.filter(a=>a.date===adminDate),filtered=all.filter(a=>(adminStatus==='all'||a.status===adminStatus)&&[a.name,a.id,a.contact].join(' ').toLowerCase().includes(adminSearch.toLowerCase())),active=filtered.filter(a=>a.status!=='cancelled'),pending=all.filter(a=>a.status==='pending');return `<div class="admin-shell"><aside class="admin-side"><span class="brand">ТИХО</span>${[['schedule','◷ Расписание'],['clients','◎ Записи'],['log','≡ Журнал']].map(([v,n])=>`<button data-admin-mode="${v}" class="${v===adminMode?'active':''}">${n}</button>`).join('')}<button data-nav="home">↗ Сайт студии</button><div class="side-end">Порядок — тоже забота.<br><br>Открытая демоверсия.<br>Без авторизации.</div></aside><div class="admin-main"><div class="admin-top"><h2>День под контролем.</h2><div><label for="admin-date">Дата расписания</label><input id="admin-date" type="date" value="${adminDate}"></div></div><p class="muted">Тестовые данные · часовой пояс браузера · только это устройство</p><div class="metrics"><div class="box"><strong>${all.filter(a=>a.status!=='cancelled').length}</strong>активных визитов</div><div class="box"><strong>${pending.length}</strong>ждут подтверждения</div><div class="box"><strong>${money(all.filter(a=>a.status!=='cancelled').reduce((n,a)=>n+srv(a.service).price,0))}</strong>план, не выручка</div></div><div class="toolbar"><select id="admin-status" aria-label="Статус">${[['all','Все статусы'],['pending','Ожидают'],['confirmed','Подтверждены'],['cancelled','Отменены']].map(([v,n])=>`<option value="${v}" ${v===adminStatus?'selected':''}>${n}</option>`).join('')}</select><input id="admin-search" aria-label="Имя, контакт или номер" value="${esc(adminSearch)}" placeholder="Имя, контакт или номер"><button class="primary" data-nav="book">+ Создать запись</button><button id="export">Экспорт CSV</button><button id="reset">Сбросить тестовые данные</button></div>${adminMode==='log'?`<h3>История действий</h3>${db.log.map(x=>`<div class="log-entry"><small>${esc(x.at)}</small>${esc(x.msg)}</div>`).join('')}`:adminMode==='clients'||adminStatus==='cancelled'?`${filtered.length?filtered.sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div class="row"><strong>${a.time}<small>${srv(a.service).duration} мин</small></strong><div><strong>${esc(a.name)}</strong><small>${srv(a.service).name} · ${mst(a.master).name}</small></div><span class="status ${a.status==='cancelled'?'cancelled':''}">${{pending:'Ожидает',confirmed:'Подтверждена',cancelled:'Отменена'}[a.status]}</span><button data-open="${a.id}">Открыть визит ↗</button></div>`).join(''):'<p>Записей по выбранным условиям нет.</p>'}`:`<div class="calendar-layout"><div class="calendar-scroll"><div class="calendar"><div></div>${masters.map(m=>`<div class="master-head"><span class="avatar">${m.name[0]}</span><span>${m.name}<small style="display:block">Демонстрационный мастер</small></span></div>`).join('')}<div class="time-axis">${Array.from({length:9},(_,i)=>`<span style="top:${i*80}px">${10+i}:00</span>`).join('')}</div>${masters.map(m=>`<div class="master-day" aria-label="Расписание ${m.name}">${active.filter(a=>a.master===m.id).map(a=>`<button class="appt ${a.status}" data-open="${a.id}" style="top:${(mins(a.time)-600)*4/3}px;height:${srv(a.service).duration*4/3-3}px;view-transition-name:visit-${a.id}" aria-label="${esc(a.name)}, ${a.time}, ${srv(a.service).name}"><strong>${a.time}–${time(mins(a.time)+srv(a.service).duration)}</strong><span>${srv(a.service).name}</span><span>${esc(a.name)} · ${a.status==='pending'?'Ожидает':'Подтверждена'}</span></button>`).join('')}</div>`).join('')}</div></div><aside class="attention"><h3>Ожидают подтверждения <span class="status">${pending.length}</span></h3>${pending.length?pending.map(a=>`<button data-open="${a.id}">${esc(a.name)}<small>${fmt(a.date)}, ${a.time} · ${mst(a.master).name}</small></button>`).join(''):'<p class="muted">Все визиты подтверждены.</p>'}<div class="note">Выберите запись в расписании, чтобы открыть детали, подтвердить, перенести или отменить визит.</div></aside></div>`}<p class="muted" style="margin-top:20px;font-size:11px">Сообщения не отправляются. Все изменения сохраняются только в этом браузере.</p></div></div>`}
function render(){app.className=route==='admin'?'':'fade';app.innerHTML=route==='book'?booking():route==='mine'?mine():route==='admin'?admin():route==='done'?`<div class="box" style="max-width:720px;margin:35px auto"><div class="success">✓</div><div class="eyebrow">Тестовая запись создана</div><h2>Время для себя<br><i>запланировано.</i></h2>${card(read().appointments.find(a=>a.id===lastId))}<div class="note">Запись ждёт подтверждения. Она появилась в кабинете администратора. Никаких сообщений не отправлено.</div><div class="actions"><button data-nav="mine">Мои записи</button><button data-nav="admin">Посмотреть в кабинете</button></div></div>`:home();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));}
function update(id,status){let db=read(),a=db.appointments.find(x=>x.id===id);if(!a||a.status==='cancelled')return;if(status==='confirmed'&&!fits(a,id)){notify('Конфликт расписания: подтверждение невозможно');return}a.status=status;log(db,`${a.id}: ${status==='cancelled'?'запись отменена, время освобождено':'визит подтверждён'}`);write(db);modal.close();if(route==='done')route='mine';render()}
function show(html,drawer=false){modal.className=drawer?'drawer':'';modal.innerHTML=html;if(!modal.open)modal.showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('button,a');if(!b)return;let d=b.dataset;if(d.section){if(route!=='home'){route='home';render()}document.querySelector('#'+d.section).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return}if(b.getAttribute('href')==='#services'){e.preventDefault();document.querySelector('#services').scrollIntoView({behavior:'smooth'});return}if(b.id==='quick-book'){draft={service:document.querySelector('#quick-service').value,master:document.querySelector('#quick-master').value,date:datePlus(1)};step=2;go('book')}if(d.masterStart){draft={master:d.masterStart,date:datePlus(1)};step=1;go('book')}if(d.detail){let x=srv(d.detail);show(`<div class="eyebrow">Выберите то, что подходит вам</div><h2>${x.name}</h2><p>${x.desc}</p><p><strong>${money(x.price)} · ${x.duration} минут</strong></p><p class="muted">Демонстрационная услуга. Точную форму, оттенок и ограничения согласуют с мастером до процедуры. Изображение — концепция, а не обещание результата.</p><div class="actions"><button class="primary" data-detail-book="${x.id}">Выбрать мастера и время</button><button data-close>Вернуться</button></div>`)}if(d.detailBook){modal.close();draft={service:d.detailBook,master:'anna',date:datePlus(1)};step=2;go('book')}if(d.adminMode){adminMode=d.adminMode;render()}if(d.open){let a=read().appointments.find(x=>x.id===d.open);show(`<div class="drawer-top"><span class="eyebrow">Карточка визита</span><button data-close aria-label="Закрыть карточку">×</button></div><h2>${esc(a.name)}</h2><p>${esc(a.contact)}</p>${card(a)}<div class="note">Демонстрационная запись. Контакт хранится в вашем браузере, отправки сообщений нет.</div>`,true)}if(d.nav){if(d.nav==='book'){step=1;draft={service:null,master:'anna',date:datePlus(1)}}go(d.nav)}if(d.service){step=1;draft={service:d.service,master:'anna',date:datePlus(1)};go('book')}if(d.pickService){draft.service=d.pickService;draft.time=null;render()}if(d.next){step=+d.next;render()}if(d.slot){draft.time=d.slot;render()}if(d.confirm)update(d.confirm,'confirmed');if(d.cancel){show(`<h2>Отменить визит?</h2><p>Время станет доступно для новой записи.</p><div class="actions"><button data-final-cancel="${d.cancel}" class="primary">Да, отменить запись</button><button data-close>Сохранить визит</button></div>`)}if(d.finalCancel)update(d.finalCancel,'cancelled');if(d.move){let a=read().appointments.find(x=>x.id===d.move);show(`<h2>Выберем другое время.</h2><form id="move-form" data-id="${a.id}"><label for="move-date">Новая дата</label><input type="date" id="move-date" required min="${datePlus(0)}" max="${datePlus(30)}" value="${a.date}"><label for="move-time">Новое начало (10:00–19:00)</label><input type="time" id="move-time" required step="1800" value="${a.time}"><p class="muted">Мастер ${mst(a.master).name}. Длительность ${srv(a.service).duration} мин. Старое окно освобождается только после успешного переноса.</p><p id="move-error" class="error" role="alert"></p><div class="actions"><button class="primary">Сохранить перенос</button><button type="button" data-close>Оставить как было</button></div></form>`,true)}if(d.remind){let a=read().appointments.find(x=>x.id===d.remind);show(`<div class="eyebrow">Предпросмотр / не отправлено</div><h2>До встречи в ТИХО.</h2><p>${esc(a.name)}, ваш визит: ${fmt(a.date)} в ${a.time}. ${srv(a.service).name}, мастер ${mst(a.master).name}.</p><p class="note">Для настоящей отправки требуется подключение канала и согласованные правила уведомлений.</p><button data-close>Закрыть</button>`)}if('close'in d)modal.close();if(b.id==='reset'){show('<h2>Начать тест заново?</h2><p>Созданные в этой демонстрации записи будут удалены. Рабочие системы не затрагиваются.</p><button class="primary" id="do-reset">Сбросить демо</button> <button data-close>Отмена</button>')}if(b.id==='do-reset'){localStorage.removeItem(KEY);seed();modal.close();route='admin';render();notify('Тестовые данные восстановлены')}if(b.id==='export'){let db=read(),rows=[['Номер','Дата','Время','Услуга','Мастер','Клиент','Статус'],...db.appointments.map(a=>[a.id,a.date,a.time,srv(a.service).name,mst(a.master).name,a.name,a.status])];let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='tiho-demo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('input',e=>{if(e.target.id==='name'||e.target.id==='contact')draft[e.target.id]=e.target.value});document.addEventListener('change',e=>{if(e.target.id==='quick-service'){let x=srv(e.target.value);document.querySelector('#quick-summary').textContent=x.duration+' мин · '+money(x.price)+'*'}if(e.target.id==='master'||e.target.id==='date'){draft[e.target.id==='master'?'master':'date']=e.target.value;draft.time=null;render()}if(e.target.id==='admin-date'){adminDate=e.target.value;render()}if(e.target.id==='admin-status'){adminStatus=e.target.value;render()}if(e.target.id==='admin-search'){adminSearch=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='booking-form'){e.preventDefault();let fd=new FormData(e.target),name=fd.get('name').trim(),contact=fd.get('contact').trim();if(name.length<2||!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)||contact.replace(/\D/g,'').length>=10)){document.querySelector('#error').textContent='Укажите имя и корректный тестовый телефон или e-mail.';return}if(!fits(draft)){document.querySelector('#error').textContent='Это окно уже занято или недоступно. Вернитесь к выбору времени.';return}let db=read(),id='T-'+crypto.randomUUID().slice(0,8).toUpperCase();db.appointments.push({...draft,id,name,contact,status:'pending'});log(db,id+': создана запись '+fmt(draft.date)+' '+draft.time);try{write(db)}catch{document.querySelector('#error').textContent='Не удалось сохранить запись. Проверьте доступность хранилища браузера.';return}lastId=id;adminDate=draft.date;route='done';render();window.scrollTo(0,0)}if(e.target.id==='move-form'){e.preventDefault();let id=e.target.dataset.id,db=read(),a=db.appointments.find(x=>x.id===id);if(!a||a.status==='cancelled'){document.querySelector('#move-error').textContent='Запись уже отменена.';return}let change={...a,date:document.querySelector('#move-date').value,time:document.querySelector('#move-time').value};if(!fits(change,id)){document.querySelector('#move-error').textContent='Это время занято, прошло или выходит за часы работы. Выберите другое.';return}let old=a.date+' '+a.time;Object.assign(a,change);log(db,id+': перенос с '+old+' на '+a.date+' '+a.time);write(db);adminDate=a.date;modal.close();if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches)document.startViewTransition(()=>render());else render();notify('Визит перенесён. Старое окно освобождено.')}});
window.addEventListener('hashchange',()=>{let r=location.hash.slice(2);route=['book','mine','admin'].includes(r)?r:'home';if(route==='book'&&!draft.master){draft={master:'anna',date:datePlus(1)};step=1}render();window.scrollTo(0,0)});window.addEventListener('storage',e=>{if(e.key===KEY)render()});route=['book','mine','admin'].includes(location.hash.slice(2))?location.hash.slice(2):'home';draft={master:'anna',date:datePlus(1)};render();

const motionOK=!matchMedia('(prefers-reduced-motion: reduce)').matches;let revealObserver=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('reveal');revealObserver.unobserve(x.target)}}),{threshold:.1});new MutationObserver(()=>{if(motionOK)document.querySelectorAll('.editorial,.studio-story').forEach(el=>revealObserver.observe(el))}).observe(app,{childList:true});if(motionOK)document.querySelectorAll('.editorial,.studio-story').forEach(el=>revealObserver.observe(el));
</script></html>
