:root{--ink:#302e26;--paper:#f6f3ec;--olive:#65704e;--line:#deded1;--soft:#e9e9dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-decoration:none}header{padding:22px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.brand{font-size:28px;letter-spacing:8px;font-weight:700}.brand small{display:block;font-size:9px;letter-spacing:3px;font-weight:400}nav{display:flex;gap:9px;flex-wrap:wrap}button,.btn{border:1px solid var(--line);padding:12px 20px;border-radius:8px;background:transparent;color:var(--ink);display:inline-block}button:hover,.btn:hover{background:var(--soft)}.primary,.active{background:var(--olive)!important;color:white!important;border-color:var(--olive)!important}main{max-width:1320px;margin:auto;padding:32px 5% 60px}h1,h2,h3,p{margin-top:0}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.08;letter-spacing:-2px}h1{font-size:clamp(48px,6.5vw,86px)}h2{font-size:42px}h3{font-size:18px}.eyebrow{letter-spacing:2px;text-transform:uppercase;font-size:10px;font-weight:700;color:var(--olive);margin-bottom:20px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:7%;align-items:center;padding:22px 0 48px}.hero p{max-width:440px;color:#6c6b60}.photo{height:470px;width:100%;object-fit:cover;border-radius:180px 180px 12px 12px;background:#d1c6b1}.pill{border:1px solid var(--line);border-radius:50px;display:inline-block;padding:7px 12px;font-size:11px;margin:8px 5px 0 0}.box{background:#fffdf8;border:1px solid var(--line);padding:25px;border-radius:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.split{display:grid;grid-template-columns:1.55fr 1fr;gap:24px}.muted{color:#77776a}.step{display:flex;gap:8px;margin:0 0 24px;flex-wrap:wrap}.step span{padding:7px 12px;border-bottom:2px solid var(--line);font-size:12px}.step .on{border-color:var(--olive);color:var(--olive)}.options{display:grid;gap:12px}.option{text-align:left;width:100%;background:#fffdf8;border-radius:12px;padding:22px}.option strong{display:block;font-size:19px}.price{float:right;font-weight:700}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.slots button{padding:10px}.slots button:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}label{display:block;font-size:12px;margin:15px 0 5px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}.checks{display:flex;gap:10px;align-items:flex-start}.checks input{width:auto;margin-top:6px}.checks label{margin:0;font-size:12px}.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.summary{position:sticky;top:20px;height:fit-content}.summary dl{display:grid;grid-template-columns:1fr 1fr;gap:15px}.summary dd{margin:0;text-align:right}.big{font:42px Georgia,serif}.note{background:var(--soft);padding:15px;border-radius:8px;font-size:12px}.status{border-radius:20px;background:#e8eedf;color:#46613b;padding:5px 10px;font-size:11px;display:inline-block}.cancelled{background:#eee4df;color:#8a5645}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.metrics strong{display:block;font:34px Georgia,serif}.row{border-bottom:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:80px 1fr 1fr 1fr;gap:15px;align-items:center}.row small{display:block;color:#777}.row button{padding:6px 10px;font-size:12px}.error{color:#9e382e;margin:15px 0}.success{font-size:60px;color:var(--olive)}footer{padding:22px 5%;border-top:1px solid var(--line);font-size:11px;color:#777;display:flex;justify-content:space-between;gap:20px}dialog{width:min(540px,94vw);border:1px solid var(--line);border-radius:16px;padding:28px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#302e2677;backdrop-filter:blur(3px)}.fade{animation:arrive .35s ease}@keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}@media(max-width:760px){header{align-items:flex-start;padding:18px 5%}.brand{font-size:21px}nav{justify-content:flex-end}nav button{padding:8px;font-size:11px}.hero,.split{grid-template-columns:1fr}.hero{gap:25px}.photo{height:320px}.grid{grid-template-columns:1fr}.metrics{gap:7px}.metrics .box{padding:12px}.metrics strong{font-size:26px}h2{font-size:34px}.row{grid-template-columns:60px 1fr;gap:10px}.slots{grid-template-columns:repeat(3,1fr)}footer{flex-direction:column}.summary{position:static}main{padding-top:24px}.hero h1{font-size:55px}} </style>
<header><a href="#/" class="brand">ТИХО<small>BROW STUDIO / DEMO</small></a><nav><button data-nav="book">Записаться ↗</button><button data-nav="mine">Мои записи</button><button data-nav="admin">Кабинет студии</button></nav></header><main id="app"></main><footer><span>Концептуальный прототип · бренд, услуги, цены и люди вымышлены.</span><span>Данные только в этом браузере. Сообщения и оплата не подключены.</span></footer><dialog id="modal"></dialog><div role="status" id="toast" style="position:fixed;bottom:20px;left:5%;background:#302e26;color:white;padding:0;border-radius:8px"></div>
<script>
const services=[{id:'shape',name:'Архитектура бровей',duration:45,price:1800,desc:'Форма и аккуратная коррекция. Естественный акцент на вашем взгляде.'},{id:'color',name:'Форма + окрашивание',duration:60,price:2500,desc:'Форма и оттенок в одном визите. Обсудите желаемую насыщенность с мастером.'},{id:'lam',name:'Ламинирование + форма',duration:90,price:3500,desc:'Укладка и оформление. Подходит ли процедура именно вам, уточнит мастер.'}];
const masters=[{id:'anna',name:'Анна',tag:'Спокойный подход, внимание к деталям'},{id:'lena',name:'Елена',tag:'Естественная форма, мягкий акцент'}];const KEY='tiho-demo-v1';let route='home',step=1,draft={},lastId=null;const app=document.querySelector('#app'),modal=document.querySelector('#modal');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function datePlus(n){let d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const fmt=d=>new Date(d+'T12:00').toLocaleDateString('ru',{day:'numeric',month:'long'});const money=n=>n.toLocaleString('ru')+' ₽';const srv=id=>services.find(x=>x.id===id);const mst=id=>masters.find(x=>x.id===id);const time=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');const mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{appointments:[],log:[]}}catch{return{appointments:[],log:[]}}}function write(db){localStorage.setItem(KEY,JSON.stringify(db))}function log(db,msg){db.log.unshift({at:new Date().toLocaleString('ru'),msg});db.log=db.log.slice(0,60)}
function seed(){if(localStorage.getItem(KEY))return;let db={appointments:[{id:'DEMO-101',service:'color',master:'anna',date:datePlus(1),time:'11:00',name:'Клиент А (тест)',contact:'demo@example.test',status:'confirmed'},{id:'DEMO-102',service:'shape',master:'lena',date:datePlus(1),time:'14:00',name:'Клиент Б (тест)',contact:'demo@example.test',status:'pending'}],log:[]};log(db,'Созданы две демонстрационные записи');write(db)}seed();
function fits(d,ignore){let s=srv(d.service),start=mins(d.time);if(!s||!mst(d.master)||!d.date||!d.time||d.date<datePlus(0)||d.date>datePlus(30)||start<600||start+s.duration>1140||start%30!==0)return false;if(d.date===datePlus(0)&&start<=new Date().getHours()*60+new Date().getMinutes())return false;return !read().appointments.some(a=>a.id!==ignore&&a.status!=='cancelled'&&a.master===d.master&&a.date===d.date&&start<mins(a.time)+srv(a.service).duration&&start+s.duration>mins(a.time))}
function go(v){if(location.hash==='#/'+v){route=v;render();window.scrollTo(0,0)}else location.hash='#/'+v}function notify(t){let n=document.querySelector('#toast');n.textContent=t;n.style.padding='13px 20px';setTimeout(()=>{n.textContent='';n.style.padding=0},3500)}function summary(){let s=srv(draft.service);return `<aside class="box summary"><div class="eyebrow">Ваш визит</div><h3>${s?.name||'Выберите услугу'}</h3><dl><dt>Мастер</dt><dd>${mst(draft.master)?.name||'—'}</dd><dt>Дата</dt><dd>${draft.date?fmt(draft.date):'—'}</dd><dt>Начало</dt><dd>${draft.time||'—'}</dd><dt>Длительность</dt><dd>${s?s.duration+' мин':'—'}</dd></dl><hr style="border:0;border-top:1px solid var(--line)"><div class="big">${s?money(s.price):'—'}</div><p class="muted">Демонстрационная цена. Оплата не требуется.</p><div class="note">Не нужно договариваться в нескольких сообщениях: все детали визита будут в одной карточке.</div></aside>`}

function booking(){return `<div class="eyebrow">Онлайн-запись / студия работает 10:00–19:00 · в демо — часовой пояс браузера</div><h2>Удобное время<br><i>уже рядом.</i></h2><div class="step">${['Услуга','Мастер и время','Контакты'].map((x,i)=>`<span class="${i+1===step?'on':''}">${i+1} / ${x}</span>`).join('')}</div><div class="split"><section>${step===1?`<div class="options">${services.map(s=>`<button class="option ${draft.service===s.id?'active':''}" data-pick-service="${s.id}"><span class="price">${money(s.price)}</span><strong>${s.name}</strong><span>${s.duration} мин · ${s.desc}</span></button>`).join('')}</div><div class="actions"><button class="primary" data-next="2" ${!draft.service?'disabled':''}>Выбрать время →</button></div>`:step===2?`<div class="box"><label for="master">Мастер</label><select id="master">${masters.map(m=>`<option value="${m.id}" ${draft.master===m.id?'selected':''}>${m.name} · ${m.tag}</option>`).join('')}</select><label for="date">Дата визита</label><input id="date" type="date" min="${datePlus(0)}" max="${datePlus(30)}" value="${draft.date}"><p class="muted" style="margin:15px 0 0">Начало процедуры · занятые окна недоступны</p><div class="slots">${Array.from({length:18},(_,i)=>time(600+i*30)).map(t=>`<button data-slot="${t}" class="${draft.time===t?'active':''}" ${!fits({...draft,time:t})?'disabled':''}>${t}</button>`).join('')}</div><p class="muted">Если удобного окна нет, выберите другую дату или мастера.</p></div><div class="actions"><button data-next="1">← Услуга</button><button class="primary" data-next="3" ${!draft.time||!fits(draft)?'disabled':''}>Продолжить →</button></div>`:`<form id="booking-form" class="box"><h3>Как к вам обращаться?</h3><p class="muted">Для теста используйте вымышленные данные. Уведомления никуда не отправляются.</p><label for="name">Имя</label><input id="name" name="name" required minlength="2" maxlength="60" autocomplete="off" value="${esc(draft.name)}" placeholder="Например, Тест Анна"><label for="contact">Телефон или e-mail</label><input id="contact" name="contact" required maxlength="100" autocomplete="off" value="${esc(draft.contact)}" placeholder="demo@example.test"><div class="checks" style="margin-top:20px"><input id="demo-consent" type="checkbox" required><label for="demo-consent">Понимаю, что это тестовая запись. Использую вымышленные данные; они сохранятся только в этом браузере.</label></div><p class="error" id="error" role="alert"></p><div class="actions"><button type="button" data-next="2">← Время</button><button class="primary">Создать тестовую запись ↗</button></div></form>`}</section>${summary()}</div>`}
function card(a){let s=srv(a.service);return `<article class="box" style="margin-bottom:16px"><span class="status ${a.status==='cancelled'?'cancelled':''}">${{pending:'Ожидает подтверждения',confirmed:'Подтверждена',cancelled:'Отменена'}[a.status]}</span><h3 style="margin:15px 0 5px">${s.name}</h3><p>${fmt(a.date)} · ${a.time}–${time(mins(a.time)+s.duration)} · ${mst(a.master).name}</p><p class="muted">${esc(a.name)} · ${money(s.price)} · № ${a.id}</p>${a.status!=='cancelled'?`<div class="actions">${a.status==='pending'?`<button data-confirm="${a.id}">Подтвердить визит</button>`:''}<button data-move="${a.id}">Перенести</button><button data-cancel="${a.id}">Отменить запись</button><button data-remind="${a.id}">Предпросмотр напоминания</button></div>`:''}</article>`}
function mine(){let all=read().appointments.filter(a=>!a.id.startsWith('DEMO'));return `<div class="eyebrow">Мои записи / демонстрация</div><h2>Все планы<br><i>в одном месте.</i></h2><p class="muted">Здесь видны тестовые записи, созданные в этом браузере. В реальном сервисе нужен защищённый вход клиента.</p>${all.length?all.map(card).join(''):`<div class="box"><h3>Пока нет записей</h3><p>Выберите услугу и время — ваш визит появится здесь и в кабинете студии.</p><button class="primary" data-nav="book">Записаться ↗</button></div>`}`}
let adminDate=datePlus(1),adminStatus='all',adminSearch='';function admin(){let db=read(),all=db.appointments.filter(a=>a.date===adminDate),filtered=all.filter(a=>(adminStatus==='all'||a.status===adminStatus)&&[a.name,a.id,a.contact].join(' ').toLowerCase().includes(adminSearch.toLowerCase()));return `<div class="eyebrow">Рабочее пространство / открытая демоверсия без авторизации</div><h2>День под контролем.</h2><p class="muted">Записи клиентов и журнал действий. Изменения сразу видны в клиентском режиме этого браузера.</p><div class="metrics"><div class="box"><strong>${all.filter(a=>a.status!=='cancelled').length}</strong>активных визитов</div><div class="box"><strong>${all.filter(a=>a.status==='pending').length}</strong>ждут подтверждения</div><div class="box"><strong>${money(all.filter(a=>a.status!=='cancelled').reduce((n,a)=>n+srv(a.service).price,0))}</strong>план, не выручка</div></div><div class="box"><div class="grid"><div><label for="admin-date">Дата расписания</label><input id="admin-date" type="date" value="${adminDate}"></div><div><label for="admin-status">Статус</label><select id="admin-status">${[['all','Все'],['pending','Ожидают'],['confirmed','Подтверждены'],['cancelled','Отменены']].map(([v,n])=>`<option value="${v}" ${v===adminStatus?'selected':''}>${n}</option>`).join('')}</select></div><div><label for="admin-search">Имя, контакт или номер</label><input id="admin-search" value="${esc(adminSearch)}" placeholder="Найти запись"></div></div><div class="actions"><button class="primary" data-nav="book">+ Создать запись</button><button id="export">Экспорт CSV</button><button id="reset">Сбросить тестовые данные</button></div>${filtered.length?filtered.sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div class="row"><strong>${a.time}<small>${srv(a.service).duration} мин</small></strong><div><strong>${esc(a.name)}</strong><small>${srv(a.service).name}<br>${mst(a.master).name} · ${a.id}</small></div><div><span class="status ${a.status==='cancelled'?'cancelled':''}">${{pending:'Ожидает',confirmed:'Подтверждена',cancelled:'Отменена'}[a.status]}</span></div><div>${a.status!=='cancelled'?`<button data-move="${a.id}">Перенести</button> <button data-cancel="${a.id}">Отменить</button>${a.status==='pending'?` <button data-confirm="${a.id}">Подтвердить</button>`:''}`:'Окно освобождено'}</div></div>`).join(''):'<p class="muted" style="margin-top:24px">На эту дату записей по выбранным условиям нет.</p>'}</div><h3 style="margin:28px 0 12px">Журнал действий</h3><div class="box">${db.log.slice(0,12).map(x=>`<p style="font-size:12px"><span class="muted">${esc(x.at)}</span> · ${esc(x.msg)}</p>`).join('')}<p class="muted">Напоминания здесь — только предпросмотр. Факта отправки нет.</p></div>`}
function render(){app.className='fade';app.innerHTML=route==='book'?booking():route==='mine'?mine():route==='admin'?admin():route==='done'?`<div class="box" style="max-width:720px;margin:35px auto"><div class="success">✓</div><div class="eyebrow">Тестовая запись создана</div><h2>Время для себя<br><i>запланировано.</i></h2>${card(read().appointments.find(a=>a.id===lastId))}<div class="note">Запись ждёт подтверждения. Она появилась в кабинете администратора. Никаких сообщений не отправлено.</div><div class="actions"><button data-nav="mine">Мои записи</button><button data-nav="admin">Посмотреть в кабинете</button></div></div>`:home();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));}
function update(id,status){let db=read(),a=db.appointments.find(x=>x.id===id);if(!a||a.status==='cancelled')return;if(status==='confirmed'&&!fits(a,id)){notify('Конфликт расписания: подтверждение невозможно');return}a.status=status;log(db,`${a.id}: ${status==='cancelled'?'запись отменена, время освобождено':'визит подтверждён'}`);write(db);modal.close();if(route==='done')route='mine';render()}
function show(html){modal.innerHTML=html;modal.showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('button,a');if(!b)return;let d=b.dataset;if(d.nav){if(d.nav==='book'){step=1;draft={service:null,master:'anna',date:datePlus(1)}}go(d.nav)}if(d.service){step=1;draft={service:d.service,master:'anna',date:datePlus(1)};go('book')}if(d.pickService){draft.service=d.pickService;draft.time=null;render()}if(d.next){step=+d.next;render()}if(d.slot){draft.time=d.slot;render()}if(d.confirm)update(d.confirm,'confirmed');if(d.cancel){show(`<h2>Отменить визит?</h2><p>Время станет доступно для новой записи.</p><div class="actions"><button data-final-cancel="${d.cancel}" class="primary">Да, отменить запись</button><button data-close>Сохранить визит</button></div>`)}if(d.finalCancel)update(d.finalCancel,'cancelled');if(d.move){let a=read().appointments.find(x=>x.id===d.move);show(`<h2>Выберем другое время.</h2><form id="move-form" data-id="${a.id}"><label for="move-date">Новая дата</label><input type="date" id="move-date" required min="${datePlus(0)}" max="${datePlus(30)}" value="${a.date}"><label for="move-time">Новое начало (10:00–19:00)</label><input type="time" id="move-time" required step="1800" value="${a.time}"><p class="muted">Мастер ${mst(a.master).name}. Длительность ${srv(a.service).duration} мин. Старое окно освобождается только после успешного переноса.</p><p id="move-error" class="error" role="alert"></p><div class="actions"><button class="primary">Сохранить перенос</button><button type="button" data-close>Оставить как было</button></div></form>`)}if(d.remind){let a=read().appointments.find(x=>x.id===d.remind);show(`<div class="eyebrow">Предпросмотр / не отправлено</div><h2>До встречи в ТИХО.</h2><p>${esc(a.name)}, ваш визит: ${fmt(a.date)} в ${a.time}. ${srv(a.service).name}, мастер ${mst(a.master).name}.</p><p class="note">Для настоящей отправки требуется подключение канала и согласованные правила уведомлений.</p><button data-close>Закрыть</button>`)}if('close'in d)modal.close();if(b.id==='reset'){show('<h2>Начать тест заново?</h2><p>Созданные в этой демонстрации записи будут удалены. Рабочие системы не затрагиваются.</p><button class="primary" id="do-reset">Сбросить демо</button> <button data-close>Отмена</button>')}if(b.id==='do-reset'){localStorage.removeItem(KEY);seed();modal.close();route='admin';render();notify('Тестовые данные восстановлены')}if(b.id==='export'){let db=read(),rows=[['Номер','Дата','Время','Услуга','Мастер','Клиент','Статус'],...db.appointments.map(a=>[a.id,a.date,a.time,srv(a.service).name,mst(a.master).name,a.name,a.status])];let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='tiho-demo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
document.addEventListener('change',e=>{if(e.target.id==='master'||e.target.id==='date'){draft[e.target.id==='master'?'master':'date']=e.target.value;draft.time=null;render()}if(e.target.id==='admin-date'){adminDate=e.target.value;render()}if(e.target.id==='admin-status'){adminStatus=e.target.value;render()}if(e.target.id==='admin-search'){adminSearch=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='booking-form'){e.preventDefault();let fd=new FormData(e.target),name=fd.get('name').trim(),contact=fd.get('contact').trim();if(name.length<2||!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)||contact.replace(/\D/g,'').length>=10)){document.querySelector('#error').textContent='Укажите имя и корректный тестовый телефон или e-mail.';return}if(!fits(draft)){document.querySelector('#error').textContent='Это окно уже занято или недоступно. Вернитесь к выбору времени.';return}let db=read(),id='T-'+crypto.randomUUID().slice(0,8).toUpperCase();db.appointments.push({...draft,id,name,contact,status:'pending'});log(db,id+': создана запись '+fmt(draft.date)+' '+draft.time);try{write(db)}catch{document.querySelector('#error').textContent='Не удалось сохранить запись. Проверьте доступность хранилища браузера.';return}lastId=id;adminDate=draft.date;route='done';render();window.scrollTo(0,0)}if(e.target.id==='move-form'){e.preventDefault();let id=e.target.dataset.id,db=read(),a=db.appointments.find(x=>x.id===id);if(!a||a.status==='cancelled'){document.querySelector('#move-error').textContent='Запись уже отменена.';return}let change={...a,date:document.querySelector('#move-date').value,time:document.querySelector('#move-time').value};if(!fits(change,id)){document.querySelector('#move-error').textContent='Это время занято, прошло или выходит за часы работы. Выберите другое.';return}let old=a.date+' '+a.time;Object.assign(a,change);log(db,id+': перенос с '+old+' на '+a.date+' '+a.time);write(db);adminDate=a.date;modal.close();render();notify('Визит перенесён. Старое окно освобождено.')}});
window.addEventListener('hashchange',()=>{let r=location.hash.slice(2);route=['book','mine','admin'].includes(r)?r:'home';if(route==='book'&&!draft.master){draft={master:'anna',date:datePlus(1)};step=1}render();window.scrollTo(0,0)});window.addEventListener('storage',e=>{if(e.key===KEY)render()});route=['book','mine','admin'].includes(location.hash.slice(2))?location.hash.slice(2):'home';draft={master:'anna',date:datePlus(1)};render();
</script></html>
